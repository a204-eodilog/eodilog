# c6g의 nginx(compose proxy 서비스). 프론트 서버 nginx가 넘긴 /api/·/ws 요청을 백엔드로 보낸다
# 인증서는 make-backend-cert.sh로 만든 자체 서명 인증서다. 프론트 서버 nginx가 이 인증서만 믿는다
server {
    listen 443 ssl;
    server_name eodilog-backend;

    ssl_certificate     /etc/nginx/certs/backend.crt;
    ssl_certificate_key /etc/nginx/certs/backend.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # 사진·캡처는 S3로 바로 올라간다. 본문이 큰 요청은 음성 경비 녹음(파일 10MB, 요청 12MB)뿐이다
    # 백엔드의 spring.servlet.multipart.max-request-size와 같은 값으로 둔다
    client_max_body_size 12m;

    # 백엔드 컨테이너를 다시 만들면 IP가 바뀐다. Docker 내부 DNS로 매번 다시 찾는다
    # 배포 중에는 백엔드가 잠깐 2개다. 내려간 쪽 주소가 2초까지 남으므로, 1초 안에 연결이 안 되면 다른 쪽으로 다시 보낸다
    resolver 127.0.0.11 valid=2s ipv6=off;
    set $backend http://backend:8080;
    proxy_connect_timeout 1s;
    proxy_next_upstream error timeout;

    location /api/ {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # 동기로 AI를 부르는 API(discovery)가 최대 50초까지 걸린다
        proxy_read_timeout 90s;
    }

    # 채팅 실시간 연결(STOMP over WebSocket)
    location = /ws {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location / {
        return 404;
    }
}
