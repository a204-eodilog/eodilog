# 운영 구성: EC2 c6g.2xlarge(ARM64, vCPU 8, 16GB) 한 대에 DB·AI·백엔드·nginx를 올린다
# 사용법은 deploy/README.md. 비밀 값은 저장소 밖 ${EODILOG_HOME}/env/*.env에 둔다
name: eodilog

x-logging: &logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

services:
  db:
    # postgis/postgis는 amd64 전용이라 ARM에서 돌지 않는다. 같은 PostGIS 17-3.5의 멀티 아키텍처 이미지
    image: imresamu/postgis:17-3.5
    env_file: ${EODILOG_HOME:-/srv/eodilog}/env/db.env
    command: >
      postgres
      -c shared_buffers=2GB
      -c effective_cache_size=6GB
      -c maintenance_work_mem=512MB
      -c work_mem=16MB
    # 장소 검색의 병렬 조회가 공유 메모리를 쓴다. Docker 기본 64MB면 큰 조회가 실패한다
    shm_size: 1g
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 5g
    restart: unless-stopped
    logging: *logging

  ai:
    build: ../ai
    image: eodilog-ai
    # 운영 키 5개만 넣는다(ai.env.example). PHOTO_MODEL_PRELOAD는 이미지에 true로 들어 있다
    env_file: ${EODILOG_HOME:-/srv/eodilog}/env/ai.env
    # 노트북 측정 대기 2.2GB, 사진 50장 처리 중 최대 2.4GB
    mem_limit: 4g
    restart: unless-stopped
    logging: *logging

  backend:
    build: ../EodiLog
    image: eodilog-backend
    env_file: ${EODILOG_HOME:-/srv/eodilog}/env/backend.env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/eodilog
      AI_BASE_URL: http://ai:8000
    depends_on:
      db:
        condition: service_healthy
    # 배포는 새 컨테이너를 먼저 띄우고 healthy가 된 뒤 옛 것을 내린다(deploy.sh). 그래서 container_name을 주지 않는다
    # 포트는 스프링이 다 뜬 뒤에 열린다. 어떤 HTTP 응답이든 오면 준비된 것이다
    healthcheck:
      test: ["CMD-SHELL", "wget -q -S -O /dev/null http://127.0.0.1:8080/ws 2>&1 | grep -q 'HTTP/'"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 180s
      start_interval: 2s
    # 내릴 때 처리 중인 요청을 끝낼 시간. AI를 동기로 부르는 요청이 최대 50초 걸린다
    stop_grace_period: 60s
    # 힙은 이 상한의 75%(Dockerfile)
    mem_limit: 4g
    restart: unless-stopped
    logging: *logging

  proxy:
    image: nginx:1.27-alpine
    # 프론트 서버(eodilog.example.com)의 nginx만 들어온다. 보안 그룹에서 443을 그 서버 IP로 제한한다
    ports:
      - "443:443"
    volumes:
      # 파일 하나가 아니라 폴더를 건다. git이 파일을 바꿔 써도 컨테이너가 새 내용을 보고 nginx -s reload로 끊김 없이 반영한다
      # nginx는 conf.d/*.conf만 읽으므로 backend.conf만 쓰인다
      - ./nginx:/etc/nginx/conf.d:ro
      - ${EODILOG_HOME:-/srv/eodilog}/certs:/etc/nginx/certs:ro
    depends_on:
      - backend
    mem_limit: 256m
    restart: unless-stopped
    logging: *logging

volumes:
  pgdata:
