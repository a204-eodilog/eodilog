spring:
  application:
    name: EodiLog
  # 접속 정보는 여기 두지 않는다. 로컬은 compose.yaml(Docker Compose 지원), 그 외는 SPRING_DATASOURCE_* 환경 변수로 받는다
  jpa:
    open-in-view: false
    hibernate:
      # 스키마는 Flyway 마이그레이션으로만 바꾼다
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration

springdoc:
  default-consumes-media-type: application/json
  default-produces-media-type: application/json
  swagger-ui:
    tags-sorter: alpha
    operations-sorter: method
    persist-authorization: true
