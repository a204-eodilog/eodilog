spring:
  application:
    name: EodiLog
  # 접속 정보는 여기 두지 않는다. 로컬은 compose.yaml(Docker Compose 지원), 그 외는 SPRING_DATASOURCE_* 환경 변수로 받는다
  jpa:
    open-in-view: false
    hibernate:
      # 스키마는 Flyway 마이그레이션으로만 바꾼다
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration
  jackson:
    deserialization:
      # API 명세 §2: 요청은 명세에 적힌 필드만 허용한다. 알 수 없는 필드는 400 VALIDATION_ERROR
      fail-on-unknown-properties: true

app:
  jobs:
    enabled: true
    polling: 1s
    timeout: 60s
    lease: 120s
    heartbeat: 20s
    max-attempts: 3
    retry-delay: 30s
    batch-size: 1
    concurrency: 2
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  auth:
    kakao-client-id: ${KAKAO_CLIENT_ID}
    kakao-client-secret: ${KAKAO_CLIENT_SECRET}
    allowed-redirects: ${KAKAO_ALLOWED_REDIRECTS}
    jwt-secret: ${JWT_SECRET}
    issuer: eodilog
    access-seconds: 3600
    refresh-seconds: 1209600
    attempt-seconds: 300

springdoc:
  default-consumes-media-type: application/json
  default-produces-media-type: application/json
  swagger-ui:
    tags-sorter: alpha
    operations-sorter: method
    persist-authorization: true

# Framework DEBUG/TRACE logging can include response bodies and resolved exception messages.
logging:
  pattern:
    correlation: "[%X{traceId:-}] "
  level:
    org.springframework.web: INFO
    org.springframework.jdbc.core: INFO
