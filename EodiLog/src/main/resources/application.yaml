spring:
  application:
    name: EodiLog
  # 접속 정보는 여기 두지 않는다. 로컬은 compose.yaml(Docker Compose 지원), 그 외는 SPRING_DATASOURCE_* 환경 변수로 받는다
  jpa:
    open-in-view: false
    hibernate:
      # 스키마는 Flyway 마이그레이션으로만 바꾼다
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration
  jackson:
    deserialization:
      # API 명세 §2: 요청은 명세에 적힌 필드만 허용한다. 알 수 없는 필드는 400 VALIDATION_ERROR
      fail-on-unknown-properties: true

app:
  polls:
    # 1분마다 마감 시각이 지난 투표를 마감한다(정책 §13 V-12)
    auto-close-enabled: true
    # 1분마다 마감 1시간 전 투표의 미투표 멤버에게 알림을 보낸다(POLL_REMINDER)
    reminder-enabled: true
  jobs:
    enabled: true
    polling: 1s
    timeout: 60s
    lease: 120s
    heartbeat: 20s
    max-attempts: 3
    retry-delay: 30s
    batch-size: 1
    concurrency: 2
  # 내부 AI 서버(ai/). 키가 없어도 서버는 시작한다. 토큰이 비면 AI가 401로 거부해 해당 작업만 실패한다
  # 시간 예산: AI 45초 < 연결 5초 + 응답 50초 < jobs timeout 60초(AI spec §1.0)
  ai:
    base-url: ${AI_BASE_URL:http://localhost:8000}
    internal-token: ${AI_INTERNAL_TOKEN:}
    connect-timeout: 5s
    read-timeout: 50s
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  storage:
    # 사진·캡처 파일을 두는 S3 버킷. 버킷은 비공개로 두고 다운로드는 서버가 권한을 확인해 전달한다
    bucket: ${STORAGE_BUCKET}
    region: ${STORAGE_REGION:ap-northeast-2}
    # 로컬은 .env의 키를 쓴다. 비우면 AWS 기본 자격 증명 체인(EC2 IAM 역할 등)을 쓴다
    access-key-id: ${AWS_ACCESS_KEY_ID:}
    secret-access-key: ${AWS_SECRET_ACCESS_KEY:}
    # 업로드 URL 유효 시간. 지나면 새 업로드 요청을 받아야 한다
    upload-url-ttl: 10m
  auth:
    kakao-client-id: ${KAKAO_CLIENT_ID}
    kakao-client-secret: ${KAKAO_CLIENT_SECRET}
    allowed-redirects: ${KAKAO_ALLOWED_REDIRECTS}
    jwt-secret: ${JWT_SECRET}
    issuer: eodilog
    access-seconds: 3600
    refresh-seconds: 1209600
    attempt-seconds: 300

springdoc:
  default-consumes-media-type: application/json
  default-produces-media-type: application/json
  swagger-ui:
    tags-sorter: alpha
    operations-sorter: method
    persist-authorization: true

# Framework DEBUG/TRACE logging can include response bodies and resolved exception messages.
logging:
  pattern:
    correlation: "[%X{traceId:-}] "
  level:
    org.springframework.web: INFO
    org.springframework.jdbc.core: INFO
