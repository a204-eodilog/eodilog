spring:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration
  jackson:
    deserialization:
      fail-on-unknown-properties: true
app:
  auth:
    kakao-client-id: test-client
    kakao-client-secret: test-secret
    allowed-redirects: https://app.example.com/oauth/kakao
    jwt-secret: test-only-key-at-least-thirty-two-bytes-long
    issuer: eodilog-test
    access-seconds: 3600
    refresh-seconds: 1209600
    attempt-seconds: 300
logging:
  level:
    org.springframework.web: INFO
    org.springframework.jdbc.core: INFO
