<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- 로그인 결과가 주소에 담겨 오므로 검색에 잡히지 않게 하고, 다른 곳으로 주소가 새지 않게 한다 -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="no-referrer" />
    <title>어디로그 로그인</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 24px;
        font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
        color: #191f28;
        background: #ffffff;
        text-align: center;
      }
      h1 {
        margin: 0;
        font-size: 20px;
      }
      p {
        margin: 0;
        font-size: 15px;
        line-height: 1.5;
        color: #4e5968;
      }
      a.button {
        margin-top: 12px;
        display: inline-block;
        min-width: 220px;
        padding: 14px 20px;
        border-radius: 12px;
        background: #2a72e5;
        color: #ffffff;
        font-size: 16px;
        font-weight: 600;
        text-decoration: none;
      }
      a.button:active {
        background: #1f5bc2;
      }
      [hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <h1 id="title">어디로그로 돌아가는 중이에요</h1>
    <p id="message">앱이 자동으로 열리지 않으면 아래 버튼을 눌러 주세요.</p>
    <a id="open" class="button" href="#" hidden>앱으로 돌아가기</a>
    <noscript><p>이 페이지는 자바스크립트가 켜져 있어야 앱으로 돌아갈 수 있어요.</p></noscript>

    <script>
      (function () {
        // 카카오가 로그인 뒤 이 주소로 code·state(또는 error)를 붙여 돌려보낸다.
        // 이 페이지는 그 값을 저장하거나 서버로 보내지 않고 앱 주소(eodilog://oauth/kakao)로만 넘긴다.
        var APP_URL = 'eodilog://oauth/kakao';
        var PASS = ['code', 'state', 'error', 'error_description'];

        var received = new URLSearchParams(window.location.search);
        var toApp = new URLSearchParams();
        PASS.forEach(function (key) {
          var value = received.get(key);
          if (value) toApp.set(key, value);
        });

        // 주소창과 방문 기록에 로그인 결과가 남지 않게 지운다
        if (window.history && window.history.replaceState) {
          window.history.replaceState(null, '', window.location.pathname);
        }

        var title = document.getElementById('title');
        var message = document.getElementById('message');
        var open = document.getElementById('open');

        if (!toApp.has('code') && !toApp.has('error')) {
          title.textContent = '로그인 정보가 없어요';
          message.textContent = '어디로그 앱에서 카카오 로그인을 다시 시작해 주세요.';
          return;
        }

        var target = APP_URL + '?' + toApp.toString();
        open.href = target;
        open.hidden = false;
        // 자동으로 앱을 연다. 브라우저가 막으면 위 버튼으로 연다
        window.location.replace(target);
      })();
    </script>
  </body>
</html>
